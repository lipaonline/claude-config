<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel</title>
<style>
  /* ---------- tokens (overridden by theme in JSON) ---------- */
  :root {
    --w: 1080px; --h: 1350px;
    --bg: #FFFFFF; --fg: #111111; --muted: #6B6B6B; --accent: #2F5BFF; --card: #F3F4F6;
    --font: "Inter", "Helvetica Neue", Arial, sans-serif;
    --display: var(--font);
    --pad: 96px; --radius: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; }

  .slide {
    width: var(--w); height: var(--h); position: relative; overflow: hidden;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; justify-content: center; padding: var(--pad);
    page-break-after: always; break-after: page;
  }
  body.only .slide { display: none; }
  body.only .slide.current { display: flex; }

  /* ---------- chrome: progress, page counter, handle ---------- */
  .progress { position: absolute; top: 0; left: 0; height: 12px; background: var(--accent); }
  .meta { position: absolute; left: var(--pad); right: var(--pad); bottom: 56px;
          display: flex; justify-content: space-between; align-items: center;
          font-size: 28px; color: var(--muted); letter-spacing: .01em; }
  .meta .handle { font-weight: 600; }
  .meta .swipe { font-weight: 800; color: var(--accent); }

  /* ---------- typography ---------- */
  .kicker { font-size: 30px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 36px; }
  .title { font-family: var(--display); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; }
  .cover .title { font-size: 112px; }
  .point .title, .list .title, .stat .title, .cta .title { font-size: 76px; margin-bottom: 40px; }
  .sub, .body { font-size: 40px; line-height: 1.35; color: var(--muted); text-wrap: pretty; }
  .body { color: var(--fg); }
  .top { justify-content: flex-start; }
  .cover .sub { margin-top: 40px; max-width: 80%; }

  .num { font-family: var(--display); font-size: 160px; font-weight: 800; line-height: 1; color: var(--accent); margin-bottom: 24px; opacity: .95; }

  .list ul { list-style: none; display: flex; flex-direction: column; gap: 28px; }
  .list li { display: flex; gap: 28px; font-size: 40px; line-height: 1.3; }
  .list li::before { content: "→"; color: var(--accent); font-weight: 800; flex: none; }
  .list.checks li::before { content: "✓"; }

  .quote .text { font-family: var(--display); font-size: 68px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .quote .text::before { content: "“"; color: var(--accent); }
  .quote .text::after { content: "”"; color: var(--accent); }
  .quote .author { margin-top: 48px; font-size: 36px; color: var(--muted); }

  .stat .big { font-family: var(--display); font-size: 220px; font-weight: 800; line-height: 1; letter-spacing: -.04em; color: var(--accent); }
  .stat .label { font-size: 44px; margin-top: 16px; }

  .image { padding: 0; }
  .image img { width: 100%; height: 100%; object-fit: cover; }
  .image .caption { position: absolute; left: var(--pad); right: var(--pad); bottom: 140px;
                    background: var(--bg); color: var(--fg); padding: 32px 40px; border-radius: var(--radius); font-size: 40px; font-weight: 700; }

  .cta .button { display: inline-block; margin-top: 48px; padding: 28px 48px; border-radius: 999px;
                 background: var(--accent); color: #fff; font-size: 40px; font-weight: 800; }
  .cta .body { max-width: 85%; }

  .card { background: var(--card); border-radius: var(--radius); padding: 48px; }

  /* ---------- theme presets ---------- */
  .theme-bold    { --bg: #FFD400; --fg: #111111; --muted: #4A4A4A; --accent: #111111; --card: #FFF3A6; }
  .theme-dark    { --bg: #0E0E10; --fg: #FFFFFF; --muted: #A1A1AA; --accent: #7CFF6B; --card: #1B1B1F; }
  .theme-editorial { --bg: #F6F1E7; --fg: #1E1B16; --muted: #6E665A; --accent: #B3402E; --card: #EDE5D6;
                     --display: "Georgia", "Times New Roman", serif; }
  .theme-minimal { --bg: #FFFFFF; --fg: #111111; --muted: #777777; --accent: #111111; --card: #F5F5F5; }
  .theme-editorial .title, .theme-editorial .quote .text { font-weight: 700; }

  @page { size: var(--w) var(--h); margin: 0; }
  @media print { html, body { background: none; } .slide { page-break-after: always; } }
</style>
</head>
<body>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const SIZES = { instagram: [1080, 1350], linkedin: [1080, 1350], square: [1080, 1080],
                  tiktok: [1080, 1920], story: [1080, 1920], wide: [1920, 1080] };
  const [w, h] = SIZES[data.format] || SIZES.instagram;
  const root = document.documentElement.style;
  root.setProperty('--w', w + 'px'); root.setProperty('--h', h + 'px');
  const t = data.theme || {};
  if (t.preset) document.body.classList.add('theme-' + t.preset);
  for (const k of ['bg', 'fg', 'muted', 'accent', 'card', 'font', 'display', 'pad', 'radius']) {
    if (t[k]) root.setProperty('--' + k, t[k]);
  }
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const br = s => esc(s).replace(/\n/g, '<br>');
  const mark = s => br(s).replace(/\*\*(.+?)\*\*/g, '<span style="color:var(--accent)">$1</span>');

  const slides = data.slides || [];
  const n = slides.length;
  const html = slides.map((s, i) => {
    const pct = ((i + 1) / n * 100).toFixed(1);
    const right = (s.type === 'cover' && n > 1) ? `<span class="swipe">${esc(t.swipe || 'Swipe →')}</span>` : `<span>${i + 1}/${n}</span>`;
    const chrome = `<div class="progress" style="width:${pct}%"></div>` +
      (s.type === 'image' ? '' :
        `<div class="meta"><span class="handle">${esc(t.handle || '')}</span>${right}</div>`);
    let inner = '';
    switch (s.type) {
      case 'cover':
        inner = `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}
                 <h1 class="title">${mark(s.title)}</h1>
                 ${s.sub ? `<p class="sub">${br(s.sub)}</p>` : ''}`;
        break;
      case 'point':
        inner = `${s.n != null ? `<div class="num">${esc(String(s.n).padStart(2, '0'))}</div>` : ''}
                 ${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}
                 <h2 class="title">${mark(s.title)}</h2>
                 ${s.body ? `<p class="body">${br(s.body)}</p>` : ''}`;
        break;
      case 'list':
        inner = `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}
                 <h2 class="title">${mark(s.title)}</h2>
                 <ul>${(s.items || []).map(it => `<li><span>${mark(it)}</span></li>`).join('')}</ul>`;
        break;
      case 'quote':
        inner = `<p class="text">${br(s.text)}</p>
                 ${s.author ? `<p class="author">— ${esc(s.author)}</p>` : ''}`;
        break;
      case 'stat':
        inner = `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}
                 <div class="big">${esc(s.value)}</div>
                 <div class="label">${mark(s.label)}</div>
                 ${s.body ? `<p class="body" style="margin-top:32px">${br(s.body)}</p>` : ''}`;
        break;
      case 'image':
        inner = `<img src="${esc(s.src)}" alt="">
                 ${s.caption ? `<div class="caption">${mark(s.caption)}</div>` : ''}`;
        break;
      case 'cta':
        inner = `${s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : ''}
                 <h2 class="title">${mark(s.title)}</h2>
                 ${s.body ? `<p class="body">${br(s.body)}</p>` : ''}
                 ${s.button ? `<div><span class="button">${esc(s.button)}</span></div>` : ''}`;
        break;
      default:
        inner = `<h2 class="title">${mark(s.title || '')}</h2>${s.body ? `<p class="body">${br(s.body)}</p>` : ''}`;
    }
    const top = s.top ? ' top' : '';
    return `<section class="slide ${esc(s.type)}${s.checks ? ' checks' : ''}${top}" data-i="${i + 1}">${chrome}${inner}</section>`;
  }).join('\n');
  document.body.insertAdjacentHTML('beforeend', html);

  const only = new URLSearchParams(location.search).get('slide');
  if (only) {
    document.body.classList.add('only');
    const el = document.querySelector(`.slide[data-i="${only}"]`);
    if (el) el.classList.add('current');
  }
})();
</script>
</body>
</html>
